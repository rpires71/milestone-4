{% extends "base.html" %}
{% block content %}
<div class="container py-5">
  <h1 class="mb-4">Edit Post</h1>
  <form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-danger">Save changes</button>
    <a href="{% url 'post_list' %}" class="btn btn-outline-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
