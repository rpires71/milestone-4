{% extends "base.html" %}
{% block content %}
<div class="container py-5">
  <h1 class="mb-4">Delete Post</h1>
  <p>Are you sure you want to delete "<strong>{{ post.title }}</strong>"?</p>
  <form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'post_list' %}" class="btn btn-outline-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
