{% extends "base.html" %}
{% block extra_title %}| Page Not Found{% endblock %}

{% block content %}
<section class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <p class="display-1 fw-bold mb-0" style="color: #C81E2D;">404</p>
      <h1 class="h3 mb-3">We couldn't find that page</h1>
      <p class="text-secondary mb-4">
        The page you're looking for doesn't exist, may have been moved,
        or isn't available right now.
      </p>
      <div class="d-flex flex-column flex-sm-row justify-content-center gap-2">
        <a href="{% url 'home' %}" class="btn btn-fithub-primary">Back to Home</a>
        <a href="{% url 'plans' %}" class="btn btn-outline-dark">Browse Plans</a>
        <a href="{% url 'products' %}" class="btn btn-outline-dark">Browse Products</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
