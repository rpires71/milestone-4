{% load allauth %}
<form method="{{ attrs.method }}"
      {% if attrs.action %}action="{{ attrs.action }}"{% endif %}>
    {% if attrs.form.non_field_errors %}
        <div class="alert alert-danger" role="alert">
            {% for error in attrs.form.non_field_errors %}
                <div>{{ error }}</div>
            {% endfor %}
        </div>
    {% endif %}
    {% slot body %}
    {% endslot %}
    {% slot actions %}
    {% endslot %}
</form>
