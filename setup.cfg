# The setup.cfg file centralises project configuration for development and
# code-quality tools. Storing these settings in a single location ensures
# consistent behaviour across the development environment, improves
# maintainability, and removes the need to repeatedly specify command-line
# options when running tools such as Flake8.

[flake8]

# Configure Flake8 to enforce consistent Python coding standards across the
# project. Centralising these settings ensures the same linting rules are
# applied whenever the codebase is analysed.

# Exclude directories and files that contain third-party libraries, generated
# content, compiled Python files, static assets, or database migration scripts.
# These locations are not part of the application's core source code and do
# not require style validation.
exclude =
    venv,
    migrations,
    staticfiles,
    __pycache__,
    .git,
    env.py

# Increase the maximum permitted line length to 100 characters. This improves
# readability in Django projects, where template tags, ORM queries and URLs
# can become unnecessarily fragmented when restricted to shorter line lengths,
# while still encouraging clean and maintainable code.
max-line-length = 100
