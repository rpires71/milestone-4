{% extends "base.html" %}

{% block extra_title %}- Delete Review{% endblock %}

{% block content %}
<div class="container py-5">
  <h1 class="mb-4">Delete review</h1>
  <p>Are you sure you want to delete your review of <strong>{{ review.product.name }}</strong>?</p>
  <div class="border rounded p-3 mb-4">
    <strong>{{ review.rating }}/5</strong>
    <p class="mb-0">{{ review.comment }}</p>
  </div>
  <form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'product_detail' review.product.slug %}" class="btn btn-outline-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
